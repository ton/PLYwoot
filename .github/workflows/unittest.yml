name: Unit tests

on:
  push:
    branches: [ master ]
    paths-ignore: ['README.md']
  pull_request:
    branches: [ master ]
    paths-ignore: ['README.md']

jobs:
  build:
    name: ${{matrix.os}}, ${{matrix.std}}, ${{matrix.build_type}}, ${{matrix.platform}}
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        platform: [x64]
        build_type: [Debug, Release]
        std: [11]

    steps:
    - uses: actions/checkout@v6

    - name: Configure
      run: |
        cmake -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DCMAKE_CXX_STANDARD=${{matrix.std}} -DPLYWOOT_WITH_TEST=ON -B build

    - name: Build
      run: cmake --build build -j

    - name: Test
      run: ctest --test-dir build -j
